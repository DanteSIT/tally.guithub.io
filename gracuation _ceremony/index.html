<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🎓 Graduation Dashboard</title>
  <link rel="stylesheet" href="cs.css" />
</head>
<body>
  <div class="container">
    <h1>🎓 Graduation Dashboard</h1>

        <div class="data-display">
      <p><strong>Students:</strong> <span id="student-value">0</span></p>
      <p><strong>Parents:</strong> <span id="parent-value">0</span></p>
      <p><strong>VIPs:</strong> <span id="vip-value">0</span></p>
    </div>
  </div>

    <div class="controls">
      <button id="plus-student">+1 Student</button>
      <button id="minus-student">-1 Student</button>
      <button id="plus-parent">+1 Parent</button>
      <button id="minus-parent">-1 Parent</button>
      <button id="plus-vip">+1 VIP</button>
      <button id="minus-vip">-1 VIP</button>
    </div>

    <div class="controls">
    <br>
    <button id="export-csv">Export to CSV</button>
    </div>



  <script src="main.js"></script>
</body>
</html>
