<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <title>Tally - Locally stored</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.4)), url('https://statehouse.gov.sc/uploads/news/2025/6433_wPebkz8mx.jpg');
            --bg: #ffffff;
            --bg-secondary: #f5f5f3;
            --border: rgba(0, 0, 0, 0.12);
            --border-hover: rgba(0, 0, 0, 0.25);
            --text: #1a1a1a;
            --text-secondary: #666660;
            --text-tertiary: #999994;
            --radius-md: 8px;
            --radius-lg: 12px;
            --green-bg: #E1F5EE;
            --green-text: #0F6E56;
            --red-bg: #FAECE7;
            --red-text: #993C1D;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1c1c1c;
                --bg-secondary: #2a2a2a;
                --border: rgba(255, 255, 255, 0.12);
                --border-hover: rgba(255, 255, 255, 0.25);
                --text: #f0f0ee;
                --text-secondary: #a0a09a;
                --text-tertiary: #666660;
                --green-bg: #fffc4d;
                --green-text: #879600;
                --red-bg: #4A1B0C;
                --red-text: #F0997B;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-image: var(--bg-image);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            color: var(--text);
            min-height: 100dvh;
            padding-bottom: env(safe-area-inset-bottom);
        }

        #app {
            padding: 1rem;
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 0 1.25rem;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
        }

        .add-btn {
            background: none;
            border: 0.5px solid var(--border-hover);
            border-radius: var(--radius-md);
            padding: 7px 14px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }

        .add-btn:hover {
            background: var(--bg-secondary);
        }

        .counters {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .counter-card {
            background: var(--bg);
            border: 0.5px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 1rem 1.25rem;
        }

        .counter-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .counter-name {
            font-size: 13px;
            color: var(--text-secondary);
            background: none;
            border: none;
            border-bottom: 0.5px solid transparent;
            padding: 2px 0;
            cursor: pointer;
            width: 100%;
            max-width: 200px;
            font-family: inherit;
            outline: none;
        }

        .counter-name:focus {
            border-bottom-color: var(--border-hover);
            color: var(--text);
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            color: var(--text-secondary);
            opacity: 0.6;
            display: flex;
            align-items: center;
        }

        .icon-btn:hover {
            opacity: 1;
            background: var(--bg-secondary);
        }

        .icon-btn.delete-confirm {
            color: var(--red-text) !important;
            opacity: 1 !important;
        }

        .counter-body {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .count-display {
            font-size: 44px;
            font-weight: 500;
            color: var(--text);
            min-width: 72px;
            text-align: center;
            line-height: 1;
        }

        .count-display.bump {
            animation: bump 0.12s ease-out;
        }

        @keyframes bump {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.18);
            }

            100% {
                transform: scale(1);
            }
        }

        .tap-btn {
            flex: 1;
            height: 60px;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 24px;
            cursor: pointer;
            transition: transform 0.08s;
            background: var(--bg-secondary);
            color: var(--text);
            font-weight: 500;
            font-family: inherit;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .tap-btn:active {
            transform: scale(0.95);
        }

        .tap-btn.plus {
            background: var(--green-bg);
            color: var(--green-text);
        }

        .counter-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 0.5px solid var(--border);
        }

        .undo-btn,
        .reset-btn {
            font-size: 12px;
            background: none;
            border: none;
            cursor: pointer;
            padding: 3px 6px;
            border-radius: 4px;
            font-family: inherit;
            color: var(--text-tertiary);
        }

        .undo-btn:hover:not(:disabled) {
            color: var(--text-secondary);
            background: var(--bg-secondary);
        }

        .undo-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .reset-btn:hover {
            color: var(--red-text);
            background: var(--red-bg);
        }

        .total-bar {
            margin-top: 1.25rem;
            padding: 0.875rem 1.25rem;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .total-num {
            font-size: 20px;
            font-weight: 500;
            color: var(--text);
        }

        .saved-badge {
            font-size: 11px;
            color: var(--text-tertiary);
            text-align: right;
            margin-top: 8px;
            min-height: 16px;
            transition: opacity 0.4s;
            opacity: 0;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="header">
            <h1>Tally</h1>
            <button class="add-btn" onclick="addCounter()">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                    <path d="M6 1v10M1 6h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
                </svg>
                Add counter
            </button>
        </div>
        <div class="counters" id="counters"></div>
        <div class="total-bar" id="total-bar" style="display:none;">
            <span class="total-label">Total across all</span>
            <span class="total-num" id="grand-total">0</span>
        </div>
        <div class="saved-badge" id="saved-badge">Saved to device</div>
    </div>

    <script>
        const STORAGE_KEY = 'tally_counters_v1';

        function load() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) { }
            return [
                { id: 1, name: 'Stuednt', count: 0, history: [] },
                { id: 2, name: 'Parent', count: 0, history: [] },
                { id: 3, name: 'VIPs', count: 0, history: [] },
            ];
        }

        let saveTimer;
        function save() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(counters));
                const el = document.getElementById('saved-badge');
                el.style.opacity = '1';
                clearTimeout(saveTimer);
                saveTimer = setTimeout(() => { el.style.opacity = '0'; }, 1800);
            } catch (e) { }
        }

        let counters = load();
        let nextId = Math.max(...counters.map(c => c.id), 0) + 1;
        let deleteConfirm = null;

        function render() {
            const container = document.getElementById('counters');
            container.innerHTML = '';

            counters.forEach(c => {
                const card = document.createElement('div');
                card.className = 'counter-card';
                card.innerHTML = `
          <div class="counter-top">
            <input class="counter-name" value="${escHtml(c.name)}" placeholder="Name…"
              onchange="renameCounter(${c.id}, this.value)"
              onclick="this.select()" />
            <div>
              <button class="icon-btn ${deleteConfirm === c.id ? 'delete-confirm' : ''}"
                onclick="deleteCounter(${c.id})"
                title="${deleteConfirm === c.id ? 'Tap again to delete' : 'Delete'}">
                <svg width="15" height="15" viewBox="0 0 14 14" fill="none">
                  <path d="M2 3.5h10M5.5 3.5V2.5h3v1M5.5 6v4.5M8.5 6v4.5M3 3.5l.5 8h7l.5-8"
                    stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
          <div class="counter-body">
            <button class="tap-btn minus" onclick="adjust(${c.id}, -1)">−</button>
            <div class="count-display" id="count-${c.id}">${c.count}</div>
            <button class="tap-btn plus" onclick="adjust(${c.id}, 1)">+</button>
          </div>
          <div class="counter-footer">
            <button class="undo-btn" onclick="undo(${c.id})" ${c.history.length === 0 ? 'disabled' : ''}>↩ Undo</button>
            <button class="reset-btn" onclick="reset(${c.id})">Reset</button>
          </div>
        `;
                container.appendChild(card);
            });

            const total = counters.reduce((s, c) => s + c.count, 0);
            document.getElementById('grand-total').textContent = total;
            document.getElementById('total-bar').style.display = counters.length < 2 ? 'none' : 'flex';
        }

        function escHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function adjust(id, delta) {
            const c = counters.find(x => x.id === id);
            c.history.push(c.count);
            if (c.history.length > 50) c.history.shift();
            c.count += delta;
            render();
            save();
            const el = document.getElementById('count-' + id);
            if (el) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
        }

        function undo(id) {
            const c = counters.find(x => x.id === id);
            if (c.history.length > 0) { c.count = c.history.pop(); render(); save(); }
        }

        function reset(id) {
            const c = counters.find(x => x.id === id);
            if (c.count !== 0) { c.history.push(c.count); c.count = 0; render(); save(); }
        }

        function renameCounter(id, name) {
            const c = counters.find(x => x.id === id);
            c.name = name.trim() || 'Counter';
            render(); save();
        }

        function addCounter() {
            counters.push({ id: nextId++, name: 'Counter ' + (counters.length + 1), count: 0, history: [] });
            render(); save();
        }

        function deleteCounter(id) {
            if (deleteConfirm === id) {
                counters = counters.filter(x => x.id !== id);
                deleteConfirm = null;
                render(); save();
            } else {
                deleteConfirm = id;
                render();
                setTimeout(() => { if (deleteConfirm === id) { deleteConfirm = null; render(); } }, 2500);
            }
        }

        render();
    </script>
</body>

</html>
